<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Admin Panel - Sonu Classes</title>
  <style>
    body { font-family: 'Arial', sans-serif; background: #e9ecef; margin: 0; padding: 20px; }
    
    /* नई गूगल एडमिन लॉक स्क्रीन */
    .lock-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .lock-icon { font-size: 60px; margin-bottom: 15px; }
    .lock-title { color: #c0392b; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
    
    .admin-box { display: none; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 450px; margin: auto; border-top: 5px solid #ff4b2b; }
    h2 { text-align: center; color: #333; margin-top: 0; }
    label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 12px; }
    input, select, button, textarea { width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; }
    
    .form-section { display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 10px; }
    .active-form { display: block; }

    button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 16px; transition: 0.3s; }
    button:hover { background: #218838; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    
    .google-btn { background-color: #fff; color: #444; border: 1px solid #ddd; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .toggle-select { background: #fff; border: 2px solid #ff4b2b; font-weight: bold; color: #ff4b2b; }
    .chapter-section { background: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; }
    .format-hint { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; font-size: 12px; margin-bottom: 10px; border: 1px solid #ffeeba; }
  </style>
</head>
<body>

  <div id="lockScreen" class="lock-container">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">खूफिया कंट्रोल रूम</div>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">यह पैनल सिर्फ सोनू सर के गूगल अकाउंट से खुलेगा</p>
    <button class="google-btn" onclick="window.adminLogin()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G" style="width: 20px; margin-right: 10px;">
      सोनू सर लॉगिन करें 🚀
    </button>
  </div>

  <div id="adminForm" class="admin-box">
    <h2>सोनू क्लासेज कंट्रोल रूम 🚀</h2>
    <div id="admin-greeting" style="text-align: center; font-weight: bold; color: #28a745; margin-bottom: 15px;"></div>
    
    <label style="color: #ff4b2b; font-size: 15px;">आप अभी क्या काम करना चाहते हैं?</label>
    <select id="formType" class="toggle-select" onchange="window.switchFormType()">
      <option value="quiz">📝 एक-एक करके क्विज़ सवाल जोड़ें</option>
      <option value="bulkQuiz">🚀 एक साथ कई सवाल डालें (Bulk Upload)</option>
      <option value="notes">📁 कक्षा 9वीं / 10वीं के पीडीएफ नोट्स जोड़ें</option>
      <option value="notice">📢 ऐप का नोटिस बोर्ड अपडेट करें</option>
    </select>

    <div id="quizFormSection" class="form-section active-form">
      <h3>सिंगल सवाल फॉर्म</h3>
      <label>टेस्ट केटेगरी:</label>
      <select id="category">
        <option value="gk">GK (सामान्य ज्ञान)</option>
        <option value="upsc">UPSC स्पेशल</option>
        <option value="ipl">IPL चैलेंज</option>
      </select>
      <label>सवाल लिखें:</label>
      <input type="text" id="question" placeholder="सवाल लिखें...">
      <label>चार ऑप्शन लिखें:</label>
      <input type="text" id="opt1" placeholder="ऑप्शन 1">
      <input type="text" id="opt2" placeholder="ऑप्शन 2">
      <input type="text" id="opt3" placeholder="ऑप्शन 3">
      <input type="text" id="opt4" placeholder="ऑप्शन 4">
      <label>सही जवाब नंबर (1, 2, 3 या 4):</label>
      <input type="number" id="ans">
      <button id="saveQuizBtn" onclick="window.saveQuestion()">💾 सवाल डेटाबेस में सेव करें</button>
    </div>

    <div id="bulkQuizFormSection" class="form-section">
      <h3>🚀 बल्क अपलोड (जादुई डिब्बा)</h3>
      <label>केटेगरी चुनें:</label>
      <select id="bulkCategory"><option value="gk">GK</option><option value="upsc">UPSC</option><option value="ipl">IPL</option></select>
      <div class="format-hint">सवालों के अंत में तीन माइनस (---) जरूर लगाएं।</div>
      <textarea id="bulkText" rows="8" placeholder="सारे सवाल यहाँ पेस्ट करें..."></textarea>
      <button id="saveBulkBtn" onclick="window.saveBulkQuestions()">⚡ एक साथ सारे सवाल सेव करें</button>
    </div>

    <div id="notesFormSection" class="form-section">
      <h3>PDF नोट्स मैनेजर फॉर्म</h3>
      <label>कक्षा चुनें:</label>
      <select id="notesClass" onchange="window.updateChaptersDropdown()"><option value="9">कक्षा 9वीं</option><option value="10">कक्षा 10वीं</option></select>
      <label>विषय चुनें:</label>
      <select id="notesSubject" onchange="window.updateChaptersDropdown()">
        <option value="math">गणित</option><option value="science">विज्ञान</option><option value="sst">SST</option><option value="hindi">हिंदी</option><option value="sanskrit">संस्कृत</option>
      </select>
      <div class="chapter-section"><label>चैप्टर चुनें:</label><select id="notesChapter"></select></div>
      <label style="margin-top:12px;">ड्राइव PDF लिंक:</label>
      <input type="url" id="pdfUrl" placeholder="https://drive.google.com/file/.../view">
      <button id="saveNotesBtn" onclick="window.saveNotesLink()">💾 पीडीएफ डेटाबेस में भेजें</button>
    </div>

    <div id="noticeFormSection" class="form-section">
      <h3>📢 ऐप का नोटिस बोर्ड बदलें</h3>
      <label>नया नोटिस संदेश लिखें (यह सभी बच्चों को दिखेगा):</label>
      <textarea id="noticeText" rows="4" placeholder="जैसे: आज शाम 7 बजे टेस्ट लाइव होगा सोनू सर की तरफ से!"></textarea>
      <button id="saveNoticeBtn" onclick="window.saveNotice()">📢 नोटिस बोर्ड लाइव करें</button>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDxHLilPMimcKi8hM6JqjCBpxcpknTtO4w",
      authDomain: "sonu-classes.firebaseapp.com",
      projectId: "sonu-classes",
      storageBucket: "sonu-classes.firebasestorage.app",
      messagingSenderId: "231395441052",
      appId: "1:231395441052:web:02ede1d22ae4c361d83059"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 🔒 सुरक्षा: सिर्फ आपकी ईमेल आईडी को परमिशन मिलेगी
    const ALLOWED_ADMIN_EMAIL = "kumarsatyam97092@gmail.com"; 

    const masterSyllabus = {
      "9": {
        "math": ["पाठ 1: संख्या पद्धति", "पाठ 2: बहुपद", "पाठ 3: निर्देशांक ज्यामिति", "पाठ 4: दो चरों वाले रैखिक समीकरण", "पाठ 5: यूक्लिड की ज्यामिति का परिचय"],
        "science": ["🔬 भौतिकी - पाठ 1: विज्ञान और मापन", "🔬 भौतिकी - पाठ 2: गति", "🧪 रसायन - पाठ 1: हमारे आस-पास के पदार्थ", "🧬 जीव विज्ञान - पाठ 1: कोशिका"],
        "sst": ["📖 इतिहास - पाठ 1: भौगोलिक खोजें", "🌍 भूगोल - पाठ 1: स्थिति और विस्तार", "💼 अर्थशास्त्र - पाठ 1: बिहार के एक गाँव की कहानी"],
        "hindi": ["गद्य - पाठ 1: कहानी का प्लॉट", "गद्य - पाठ 2: नालंदा"],
        "sanskrit": ["पाठ 1: ईशस्तुतिः", "पाठ 2: संस्कृतस्य महत्त्वम्"]
      },
      "10": {
        "math": ["पाठ 1: वास्तविक संख्याएँ", "पाठ 2: बहुपद", "पाठ 3: दो चरों वाले रैखिक समीकरण युग्म", "पाठ 4: द्विघात समीकरण"],
        "science": ["🔬 भौतिकी - पाठ 1: प्रकाश का परावर्तन", "🔬 भौतिकी - पाठ 2: प्रकाश का अपवर्तन", "🧪 रसायन - पाठ 1: रासायनिक अभिक्रियाएं", "🧬 जीव विज्ञान - पाठ 1: जैव प्रक्रम"],
        "sst": ["📖 इतिहास - पाठ 1: यूरोप में राष्ट्रवाद", "🌍 भूगोल - पाठ 1: भारत : संसाधन एवं उपयोग"],
        "hindi": ["गद्य - पाठ 1: श्रम विभाजन और जाति प्रथा"],
        "sanskrit": ["पाठ 1: मंगलम्", "पाठ 2: पाटलिपुत्रवैभवम्"]
      }
    };

    window.adminLogin = function() {
      signInWithPopup(auth, provider).then((result) => {
        const user = result.user;
        if(user.email === ALLOWED_ADMIN_EMAIL) {
          document.getElementById("lockScreen").style.display = "none";
          document.getElementById("adminForm").style.display = "block";
          document.getElementById("admin-greeting").innerText = "स्वागत है सोनू सर! ❤️";
          window.updateChaptersDropdown();
        } else {
          alert("एक्सेस ब्लॉक! आप सोनू सर नहीं हैं।");
        }
      }).catch((e) => alert("त्रुटि: " + e.message));
    };

    window.switchFormType = function() {
      var type = document.getElementById("formType").value;
      document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active-form'));
      document.getElementById(type + "FormSection").classList.add("active-form");
    };

    window.updateChaptersDropdown = function() {
      var classVal = document.getElementById("notesClass").value;
      var subjectVal = document.getElementById("notesSubject").value;
      var chapterSelect = document.getElementById("notesChapter");
      chapterSelect.innerHTML = "";
      masterSyllabus[classVal][subjectVal].forEach(function(chapName) {
        var option = document.createElement("option"); option.value = chapName; option.innerText = chapName;
        chapterSelect.appendChild(option);
      });
    };

    window.saveQuestion = async function() {
      var btn = document.getElementById("saveQuizBtn");
      var qText = document.getElementById("question").value.trim();
      var opt1 = document.getElementById("opt1").value.trim();
      var opt2 = document.getElementById("opt2").value.trim();
      var opt3 = document.getElementById("opt3").value.trim();
      var opt4 = document.getElementById("opt4").value.trim();
      var ans = document.getElementById("ans").value.trim();
      if (!qText || !opt1 || !opt2 || !opt3 || !opt4 || !ans) return alert("सब भरें!");
      btn.innerText = "सेव हो रहा है... ⏳"; btn.disabled = true;
      try {
        await addDoc(collection(db, "quizzes"), { category: document.getElementById("category").value, question: qText, options: [opt1, opt2, opt3, opt4], answer: parseInt(ans), createdAt: serverTimestamp() });
        alert("सवाल सेव हो गया!");
        document.querySelectorAll('#quizFormSection input').forEach(i => i.value = '');
      } catch (e) { alert(e.message); }
      btn.innerText = "💾 सवाल डेटाबेस में सेव करें"; btn.disabled = false;
    };

    window.saveBulkQuestions = async function() {
      var btn = document.getElementById("saveBulkBtn");
      var text = document.getElementById("bulkText").value.trim();
      if (!text) return alert("पेस्ट करें!");
      btn.innerText = "सेव हो रहा है... ⏳"; btn.disabled = true;
      var blocks = text.split("---"); var successCount = 0;
      try {
        for (let block of blocks) {
          block = block.trim(); if (!block) continue;
          let lines = block.split('\n').map(l => l.trim());
          let q = "", o1 = "", o2 = "", o3 = "", o4 = "", ans = 0;
          for (let line of lines) {
            if (line.startsWith("प्रश्न:")) q = line.substring(5).trim();
            else if (line.startsWith("A:")) o1 = line.substring(2).trim();
            else if (line.startsWith("B:")) o2 = line.substring(2).trim();
            else if (line.startsWith("C:")) o3 = line.substring(2).trim();
            else if (line.startsWith("D:")) o4 = line.substring(2).trim();
            else if (line.startsWith("उत्तर:")) ans = parseInt(line.substring(6).trim());
          }
          if (q && o1 && o2 && o3 && o4 && ans) {
            await addDoc(collection(db, "quizzes"), { category: document.getElementById("bulkCategory").value, question: q, options: [o1, o2, o3, o4], answer: ans, createdAt: serverTimestamp() });
            successCount++;
          }
        }
        alert("🎉 " + successCount + " सवाल सेव हुए!"); document.getElementById("bulkText").value = "";
      } catch (e) { alert(e.message); }
      btn.innerText = "⚡ एक साथ सारे सवाल सेव करें"; btn.disabled = false;
    };

    window.saveNotesLink = async function() {
      var btn = document.getElementById("saveNotesBtn");
      var pdfUrl = document.getElementById("pdfUrl").value.trim();
      if (!pdfUrl) return alert("ड्राइव लिंक डालें!");
      btn.innerText = "सेव हो रहा है... ⏳"; btn.disabled = true;
      try {
        await addDoc(collection(db, "pdf_notes"), { class: document.getElementById("notesClass").value, subject: document.getElementById("notesSubject").value, chapter: document.getElementById("notesChapter").value, url: pdfUrl, createdAt: serverTimestamp() });
        alert("पीडीएफ सेव हो गया!"); document.getElementById("pdfUrl").value = "";
      } catch (e) { alert(e.message); }
      btn.innerText = "💾 पीडीएफ डेटाबेस में भेजें"; btn.disabled = false;
    };

    // 📢 नोटिस बोर्ड सेव करने की कोडिंग
    window.saveNotice = async function() {
      var btn = document.getElementById("saveNoticeBtn");
      var nText = document.getElementById("noticeText").value.trim();
      if(!nText) return alert("नोटिस लिखें!");
      btn.innerText = "लाइव हो रहा है... ⏳"; btn.disabled = true;
      try {
        await addDoc(collection(db, "announcements"), { text: nText, createdAt: serverTimestamp() });
        alert("📢 नोटिस बोर्ड लाइव हो गया सोनू सर!");
        document.getElementById("noticeText").value = "";
      } catch(e) { alert(e.message); }
      btn.innerText = "📢 नोटिस बोर्ड लाइव करें"; btn.disabled = false;
    };
  </script>
</body>
</html>
