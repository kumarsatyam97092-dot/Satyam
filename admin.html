<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Admin Panel - Sonu Classes</title>
  <style>
    body { font-family: 'Arial', sans-serif; background: #e9ecef; margin: 0; padding: 20px; }
    
    /* लॉक स्क्रीन */
    .lock-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; }
    .lock-icon { font-size: 60px; margin-bottom: 15px; }
    .lock-title { color: #c0392b; font-size: 24px; font-weight: bold; margin-bottom: 15px; }
    
    /* मुख्य डैशबोर्ड */
    .admin-box { display: none; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; border-top: 5px solid #ff4b2b; }
    h2 { text-align: center; color: #333; margin-top: 0; }
    label { font-weight: bold; font-size: 14px; color: #555; display: block; margin-top: 12px; }
    input, select, button, textarea { width: 100%; padding: 12px; margin: 6px 0 12px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 14px; }
    textarea { resize: vertical; }
    
    .form-section { display: none; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-top: 10px; }
    .active-form { display: block; }

    button { background: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; font-size: 16px; transition: 0.3s; }
    button:hover { background: #218838; }
    button:disabled { background: #6c757d; cursor: not-allowed; }
    
    .google-btn { background-color: #fff; color: #444; border: 1px solid #ddd; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; width: 100%; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .toggle-select { background: #fff; border: 2px solid #ff4b2b; font-weight: bold; color: #ff4b2b; }
    .chapter-section { background: #fff; padding: 10px; border-radius: 8px; margin-top: 10px; border: 1px solid #ddd; }
    .format-hint { background: #fff3cd; color: #856404; padding: 10px; border-radius: 5px; font-size: 12px; margin-bottom: 10px; border: 1px solid #ffeeba; }
    .radio-group { display: flex; gap: 15px; margin-top: 10px; margin-bottom: 10px; background: #fff; padding: 10px; border-radius: 8px; border: 1px solid #ddd; }
    .radio-group label { margin-top: 0; font-weight: normal; cursor: pointer; display: flex; align-items: center; gap: 5px; }
  </style>
</head>

  <div id="lockScreen" class="lock-container">
    <div class="lock-icon">🔒</div>
    <div class="lock-title">खूफिया कंट्रोल रूम</div>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">यह पैनल सिर्फ सोनू सर के गूगल अकाउंट से खुलेगा</p>
    <button class="google-btn" onclick="window.adminLogin()">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="G" style="width: 20px; margin-right: 10px;">
      सोनू सर लॉगिन करें 🚀
    </button>
  </div>

  <div id="adminForm" class="admin-box">

    <div id="admin-greeting" style="text-align: center; font-weight: bold; color: #28a745; margin-bottom: 15px;"></div>
    
    <label style="color: #ff4b2b; font-size: 15px;">आप अभी क्या काम करना चाहते हैं?</label>

      <option value="delete">🗑️ पुराने सवाल मिटाएं (Clear All)</option>
      <option value="notice">📢 ऐप का नोटिस बोर्ड अपडेट करें</option>
    </select>

    <div id="notesFormSection" class="form-section active-form">
      <h3>📁 PDF नोट्स मैनेजर</h3>
      <label>कक्षा चुनें:</label>
      <select id="notesClass" onchange="window.updateChapters('notes')"><option value="9">कक्षा 9वीं</option><option value="10">कक्षा 10वीं</option></select>
      <label>विषय चुनें:</label>
      <select id="notesSubject" onchange="window.updateChapters('notes')">

      <div id="bulkGeneralDiv">
        <label>केटेगरी चुनें:</label>
        <select id="bulkCategory"><option value="gk">GK</option><option value="upsc">UPSC</option><option value="ipl">IPL</option></select>
      </div>

      <div id="bulkChapterDiv" style="display:none;" class="chapter-section">

      <button id="saveNoticeBtn" onclick="window.saveNotice()">📢 नोटिस बोर्ड लाइव करें</button>

    window.adminLogin = function() {
      signInWithPopup(auth, provider).then((result) => {
        if(result.user.email === ALLOWED_ADMIN_EMAIL) {
          document.getElementById("lockScreen").style.display = "none";
          document.getElementById("adminForm").style.display = "block";
          document.getElementById("admin-greeting").innerText = "स्वागत है सोनू सर! ❤️";
          window.updateChapters('notes'); window.updateChapters('bulk'); window.updateChapters('del');
        } else { alert("एक्सेस ब्लॉक! आप सोनू सर नहीं हैं।"); }
      }).catch((e) => alert("त्रुटि: " + e.message));
    };

    window.switchFormType = function() {
      var type = document.getElementById("formType").value;
      document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active-form'));
      document.getElementById(type + "FormSection").classList.add("active-form");
    };

    // UI Toggles
    window.toggleBulkType = function() {
      var type = document.querySelector('input[name="bulkType"]:checked').value;
      document.getElementById("bulkGeneralDiv").style.display = (type === 'general') ? 'block' : 'none';
      document.getElementById("bulkChapterDiv").style.display = (type === 'chapter') ? 'block' : 'none';
    };
    window.toggleDelType = function() {
      var type = document.querySelector('input[name="delType"]:checked').value;
      document.getElementById("delGeneralDiv").style.display = (type === 'general') ? 'block' : 'none';
      document.getElementById("delChapterDiv").style.display = (type === 'chapter') ? 'block' : 'none';
    };

    // चैप्टर ड्रॉपडाउन अपडेटर
    window.updateChapters = function(prefix) {
      var classVal = document.getElementById(prefix + "Class").value;
      var subjectVal = document.getElementById(prefix + "Subject").value;
      var chapterSelect = document.getElementById(prefix + "Chapter");
      chapterSelect.innerHTML = "";
      if(syllabusData[classVal] && syllabusData[classVal][subjectVal]) {
        syllabusData[classVal][subjectVal].forEach(function(chapName) {
          var option = document.createElement("option"); option.value = chapName; option.innerText = chapName;
          chapterSelect.appendChild(option);
        });
      }
    };

    // 🚀 जादुई बल्क अपलोड
    window.saveBulkQuestions = async function() {
      var btn = document.getElementById("saveBulkBtn");
      var text = document.getElementById("bulkText").value.trim();
      if (!text) return alert("पेस्ट करें!");
      
      // यह पता लगाना कि जनरल में डालना है या चैप्टर में
      var uploadType = document.querySelector('input[name="bulkType"]:checked').value;
      var targetCategory = "";
      if(uploadType === "general") {
        targetCategory = document.getElementById("bulkCategory").value;
      } else {
        targetCategory = document.getElementById("bulkChapter").value;
        if(!targetCategory) return alert("कृपया चैप्टर चुनें!");
      }

      btn.innerText = "सेव हो रहा है... ⏳"; btn.disabled = true;
      var blocks = text.split("---"); var successCount = 0;
      try {
        for (let block of blocks) {
          block = block.trim(); if (!block) continue;
          let lines = block.split('\n').map(l => l.trim());
          let q = "", o1 = "", o2 = "", o3 = "", o4 = "", ans = 0;
          for (let line of lines) {
            if (line.startsWith("प्रश्न:")) q = line.substring(5).trim();
            else if (line.startsWith("A:")) o1 = line.substring(2).trim();
            else if (line.startsWith("B:")) o2 = line.substring(2).trim();
            else if (line.startsWith("C:")) o3 = line.substring(2).trim();
            else if (line.startsWith("D:")) o4 = line.substring(2).trim();
            else if (line.startsWith("उत्तर:")) ans = parseInt(line.substring(6).trim());
          }
          if (q && o1 && o2 && o3 && o4 && ans) {
            await addDoc(collection(db, "quizzes"), { category: targetCategory, question: q, options: [o1, o2, o3, o4], answer: ans, createdAt: serverTimestamp() });
            successCount++;
          }
        }
        alert("🎉 " + successCount + " सवाल सेव हुए!"); document.getElementById("bulkText").value = "";
      } catch (e) { alert(e.message); }
      btn.innerText = "⚡ एक साथ सारे सवाल सेव करें"; btn.disabled = false;
    };

    // 🗑️ डिलीट करने का कोड
    window.clearQuestions = async function() {
      var delType = document.querySelector('input[name="delType"]:checked').value;
      var targetCategory = "";
      if(delType === "general") {
        targetCategory = document.getElementById("delCategory").value;
      } else {
        targetCategory = document.getElementById("delChapter").value;
      }

      var confirmDelete = confirm(`क्या आप सच में '${targetCategory}' के सारे पुराने सवाल हमेशा के लिए डिलीट करना चाहते हैं?`);
      if(!confirmDelete) return;

      var btn = document.getElementById("clearBtn");
      btn.innerText = "डिलीट हो रहा है... ⏳"; btn.disabled = true;

      try {
        const q = query(collection(db, "quizzes"), where("category", "==", targetCategory));
        const querySnapshot = await getDocs(q);
        let count = 0;
        const deletePromises = [];
        querySnapshot.forEach((docSnap) => {
          deletePromises.push(deleteDoc(docSnap.ref));
          count++;
        });
        await Promise.all(deletePromises);
        
        if(count === 0) { alert("इस केटेगरी में मिटाने के लिए कोई सवाल नहीं है!"); } 
        else { alert(`✅ सफाई पूरी हुई! ${count} पुराने सवाल डिलीट कर दिए गए।`); }
      } catch(e) { alert("एरर: " + e.message); }
      btn.innerText = "🚨 सारे पुराने सवाल डिलीट करें"; btn.disabled = false;
    };

    // 📁 PDF सेव करना
    window.saveNotesLink = async function() {

      if (!pdfUrl) return alert("लिंक डालें!");
